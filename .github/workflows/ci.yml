name: AEON verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[deployment]'
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: enterprise/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify HTTP worker bridge
        env:
          PYTHONPATH: ..
        run: |
          npm run dev -- --ephemeral > /tmp/aeon-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          python tests/bridge_verify.py
