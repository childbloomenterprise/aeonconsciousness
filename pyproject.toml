[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeon-research-core"
version = "0.1.0"
description = "Persistent artificial inner-instrument research platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["aeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[project.scripts]
aeon-api = "aeon.api.app:run"

