[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebee-improve"
version = "0.2.0"
description = "Controlled self-improvement core and AEON multi-entity AI2-THOR runtime"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Codebee contributors"}]
dependencies = []

[project.optional-dependencies]
world = [
  "ai2thor==5.0.0",
  "Pillow>=11,<12",
]

[project.scripts]
aeon-world = "aeon_world.cli:main"

[tool.setuptools.packages.find]
include = ["codebee_improve*", "aeon_world*"]
